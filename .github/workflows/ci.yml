name: Offline code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic offline tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q run_azh_pilot.py run_train_cv.py study_utils.py make_figures.py verify_results.py
